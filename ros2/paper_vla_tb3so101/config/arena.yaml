# Geometría única del escenario: de aquí salen el mundo SDF, el mapa de Nav2 y las métricas de holgura.
arena:
  width: 15.0          # m (eje x)
  height: 12.0         # m (eje y)
  origin: [-5.0, -4.0] # esquina inferior izquierda en el marco map = marco del mundo de Gazebo
  resolution: 0.05
  wall_thickness: 0.1
robot:
  start: [0.0, 0.0, 0.0]
  radius: 0.24         # radio circunscrito respecto al eje de ruedas (esquina trasera a 0.24 m)
  footprint: [-0.205, 0.075, -0.18, 0.18]   # xmin, xmax, ymin, ymax (m): caja de 0.266 m + ruedas, en base_footprint
obstacles:             # cilindros de 0.5 m de diámetro. obs1 y obs2 son los del texto del paper
  - {name: obs1, x: 1.0, y: 0.8, radius: 0.25}
  - {name: obs2, x: 1.5, y: 2.2, radius: 0.25}
  - {name: obs3, x: 0.3, y: 2.1, radius: 0.25}
  - {name: obs4, x: 1.9, y: 0.5, radius: 0.25}
goal: {x: 2.0, y: 1.5, yaw: 0.0}
pick_object: {x: 2.16, y: 1.5, size: 0.040, mass: 0.040}   # cubo verde de 4 cm (hueco máx. de la pinza del OM-X = 56 mm), 0.6 m delante de la meta de navegación
mision:            # v2: ver config/ubicaciones.yaml (el plato está 0.16 m delante de `entrega`)
  plato: {x: 2.16, y: -1.5, radius: 0.10}
cubos:             # v2: tres cubos de 4 cm en la zona de recojo (0.16 m delante de `recojo`), separados 0.10 m; la misión los baraja
  - {name: cubo_rojo,  color: rojo,  rgb: [0.85, 0.1, 0.1], x: 2.16, y: 1.60}
  - {name: pick_object, color: verde, rgb: [0.1, 0.85, 0.1], x: 2.16, y: 1.50}
  - {name: cubo_azul,  color: azul,  rgb: [0.1, 0.2, 0.9], x: 2.16, y: 1.40}
