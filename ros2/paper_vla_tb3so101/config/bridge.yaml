# ROS 2 <-> Gazebo Fortress. Todos los tópicos del robot en un solo sitio.
- {ros_topic_name: /clock,             gz_topic_name: /clock,             ros_type_name: rosgraph_msgs/msg/Clock,        gz_type_name: gz.msgs.Clock,        direction: GZ_TO_ROS}
- {ros_topic_name: /cmd_vel,           gz_topic_name: /cmd_vel,           ros_type_name: geometry_msgs/msg/Twist,        gz_type_name: gz.msgs.Twist,        direction: ROS_TO_GZ}
- {ros_topic_name: /odom,              gz_topic_name: /odom,              ros_type_name: nav_msgs/msg/Odometry,          gz_type_name: gz.msgs.Odometry,     direction: GZ_TO_ROS}
- {ros_topic_name: /tf,                gz_topic_name: /tf,                ros_type_name: tf2_msgs/msg/TFMessage,         gz_type_name: gz.msgs.Pose_V,       direction: GZ_TO_ROS}
- {ros_topic_name: /scan,              gz_topic_name: /scan,              ros_type_name: sensor_msgs/msg/LaserScan,      gz_type_name: gz.msgs.LaserScan,    direction: GZ_TO_ROS}
- {ros_topic_name: /camera/image_raw,  gz_topic_name: /camera/image_raw,  ros_type_name: sensor_msgs/msg/Image,          gz_type_name: gz.msgs.Image,        direction: GZ_TO_ROS}
- {ros_topic_name: /camera/camera_info,gz_topic_name: /camera/camera_info,ros_type_name: sensor_msgs/msg/CameraInfo,     gz_type_name: gz.msgs.CameraInfo,   direction: GZ_TO_ROS}
- {ros_topic_name: /imu,               gz_topic_name: /imu,               ros_type_name: sensor_msgs/msg/Imu,            gz_type_name: gz.msgs.IMU,          direction: GZ_TO_ROS}
- {ros_topic_name: /gt_tf, gz_topic_name: /world/paper_vla_world/dynamic_pose/info, ros_type_name: tf2_msgs/msg/TFMessage, gz_type_name: gz.msgs.Pose_V, direction: GZ_TO_ROS}
- {ros_topic_name: /wrist_camera/image_raw, gz_topic_name: /wrist_camera/image_raw, ros_type_name: sensor_msgs/msg/Image, gz_type_name: gz.msgs.Image, direction: GZ_TO_ROS}
- {ros_topic_name: /wrist_camera/camera_info, gz_topic_name: /wrist_camera/camera_info, ros_type_name: sensor_msgs/msg/CameraInfo, gz_type_name: gz.msgs.CameraInfo, direction: GZ_TO_ROS}
- {ros_topic_name: /vista_arena/image_raw, gz_topic_name: /vista_arena/image_raw, ros_type_name: sensor_msgs/msg/Image, gz_type_name: gz.msgs.Image, direction: GZ_TO_ROS}
- {ros_topic_name: /vista_robot/image_raw, gz_topic_name: /vista_robot/image_raw, ros_type_name: sensor_msgs/msg/Image, gz_type_name: gz.msgs.Image, direction: GZ_TO_ROS}
- {ros_topic_name: /vista_robot2/image_raw, gz_topic_name: /vista_robot2/image_raw, ros_type_name: sensor_msgs/msg/Image, gz_type_name: gz.msgs.Image, direction: GZ_TO_ROS}
- {ros_topic_name: /vista_meta/image_raw, gz_topic_name: /vista_meta/image_raw, ros_type_name: sensor_msgs/msg/Image, gz_type_name: gz.msgs.Image, direction: GZ_TO_ROS}
- {ros_topic_name: /scene_camera/image_raw, gz_topic_name: /scene_camera/image_raw, ros_type_name: sensor_msgs/msg/Image, gz_type_name: gz.msgs.Image, direction: GZ_TO_ROS}
